name: NixOS configuration evaluation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - "flake.nix"
      - "flake.lock"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: nixos-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static analysis and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Resolve commit range
        id: range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          head_sha="$GITHUB_SHA"

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            push)
              base_sha="$PUSH_BEFORE_SHA"
              if [[ "$base_sha" =~ ^0{40}$ ]]; then
                base_sha="$(git rev-parse "$head_sha^" 2>/dev/null || printf '%s' "$head_sha")"
              fi
              ;;
            workflow_dispatch)
              base_sha="$(git rev-parse "$head_sha^" 2>/dev/null || printf '%s' "$head_sha")"
              ;;
            *)
              echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Run format, lint, tests and secret scanning
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          nixpkgs_rev="$(jq -r '.nodes.nixpkgs.locked.rev // empty' flake.lock)"
          [[ "$nixpkgs_rev" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not read a pinned nixpkgs revision from flake.lock."
            exit 1
          }

          # Tool versions come from the repository's locked nixpkgs revision.
          nix shell \
            "github:NixOS/nixpkgs/$nixpkgs_rev#nixfmt" \
            "github:NixOS/nixpkgs/$nixpkgs_rev#statix" \
            "github:NixOS/nixpkgs/$nixpkgs_rev#deadnix" \
            "github:NixOS/nixpkgs/$nixpkgs_rev#shellcheck" \
            "github:NixOS/nixpkgs/$nixpkgs_rev#shfmt" \
            "github:NixOS/nixpkgs/$nixpkgs_rev#ruff" \
            "github:NixOS/nixpkgs/$nixpkgs_rev#actionlint" \
            "github:NixOS/nixpkgs/$nixpkgs_rev#gitleaks" \
            "github:NixOS/nixpkgs/$nixpkgs_rev#python3" \
            --command bash scripts/ci-quality.sh "$BASE_SHA" "$HEAD_SHA"

  evaluate:
    needs: quality
    name: Evaluate ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        host:
          - elytra
          - titan
          - atlas
          - pico
          - palco
    steps:
      - name: Check out repository
        # SHA completo de actions/checkout v7.0.1; las credenciales quedan fuera de .git/config.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
              ;;
            push)
              git diff --check "$PUSH_BEFORE_SHA" "$GITHUB_SHA"
              ;;
            workflow_dispatch)
              git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
              ;;
            *)
              echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

      - name: Detect Nori package build changes
        id: nori
        if: matrix.host == 'elytra'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              changed_files="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
              ;;
            push)
              changed_files="$(git diff --name-only "$PUSH_BEFORE_SHA" "$GITHUB_SHA")"
              ;;
            workflow_dispatch)
              changed_files="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA")"
              ;;
            *)
              echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          if printf '%s\n' "$changed_files" | grep -Eq '^(packages/nori\.nix|packages/nori-cli\.nix|nixpkgs/pkgs/by-name/no/nori/package\.nix|nixpkgs/pkgs/by-name/no/nori-cli/package\.nix|hosts/portatil/configuration\.nix|hosts/torre/configuration\.nix|flake\.nix|flake\.lock|\.github/workflows/nixos-check\.yml)$'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate shell, Fish and privacy helper syntax
        if: matrix.host == 'elytra'
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
            echo "Syntax OK: $script"
          done

          nix eval --raw ".#nixosConfigurations.elytra.config.home-manager.users.juan.programs.fish.interactiveShellInit" > /tmp/kigo-fish-init.fish
          nix build --no-link ".#nixosConfigurations.elytra.pkgs.fish"
          fish_path="$(nix eval --raw ".#nixosConfigurations.elytra.pkgs.fish.outPath")"
          "$fish_path/bin/fish" --no-execute /tmp/kigo-fish-init.fish
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for path in (
              Path("scripts/rustdesk-privacy-grabber.py"),
              Path("scripts/rustdesk-privacy-monitor.py"),
          ):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"Syntax OK: {path}")
          PY

      - name: Check flake outputs
        if: matrix.host == 'titan'
        run: |
          nix flake check --no-build --show-trace

      - name: Build deploy-rs schema and activation checks
        if: matrix.host == 'titan'
        run: |
          nix build --no-link --show-trace \
            .#checks.x86_64-linux.deploy-schema \
            .#checks.x86_64-linux.deploy-activate

      - name: Evaluate system closure
        run: |
          nix eval --show-trace --raw ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath" >/dev/null

      - name: Verify Elytra resource policy
        if: matrix.host == 'elytra'
        run: |
          test "$(nix eval --json '.#nixosConfigurations.elytra.config.nix.settings.max-jobs')" = "2"
          test "$(nix eval --json '.#nixosConfigurations.elytra.config.nix.settings.cores')" = "2"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.nix.daemonCPUSchedPolicy')" = "idle"
          test "$(nix eval --json '.#nixosConfigurations.elytra.config.zramSwap.enable')" = "true"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.zramSwap.algorithm')" = "zstd"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.services.scx-loader.config.default_mode')" = "Auto"
          test "$(nix eval --json '.#nixosConfigurations.elytra.config.services.power-profiles-daemon.enable')" = "true"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.home-manager.users.juan.qt.kde.settings.powerdevilrc.AC.Performance.PowerProfile')" = "performance"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.home-manager.users.juan.qt.kde.settings.powerdevilrc.Battery.Performance.PowerProfile')" = "power-saver"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.home-manager.users.juan.qt.kde.settings.powerdevilrc.LowBattery.Performance.PowerProfile')" = "power-saver"

      - name: Build headless server closure
        if: matrix.host == 'atlas' || matrix.host == 'pico'
        run: |
          nix build --no-link --show-trace ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

      - name: Build the declarative Nori desktop package
        if: matrix.host == 'elytra' && steps.nori.outputs.required == 'true'
        run: |
          nix build --no-link --show-trace ".#packages.x86_64-linux.nori"

      - name: Build the declarative Nori CLI package
        if: matrix.host == 'elytra' && steps.nori.outputs.required == 'true'
        run: |
          nix build --no-link --show-trace ".#packages.x86_64-linux.nori-cli"
