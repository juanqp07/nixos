name: NixOS configuration evaluation

on:
  pull_request:
    paths:
      - "**.nix"
      - "flake.nix"
      - "flake.lock"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/nixos-check.yml"
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - "flake.nix"
      - "flake.lock"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/nixos-check.yml"

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - elytra
          - titan
          - atlas
          - pico
          - palco
    steps:
      - name: Check out repository
        # SHA completo de actions/checkout v6: runtime Node 24 y credenciales
        # Git almacenadas en RUNNER_TEMP en lugar de .git/config.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          else
            git diff --check "$PUSH_BEFORE_SHA" "$GITHUB_SHA"
          fi

      - name: Detect Nori package build changes
        id: nori
        if: matrix.host == 'elytra'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$PUSH_BEFORE_SHA" "$GITHUB_SHA")"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(packages/nori\.nix|packages/nori-cli\.nix|nixpkgs/pkgs/by-name/no/nori/package\.nix|nixpkgs/pkgs/by-name/no/nori-cli/package\.nix|hosts/portatil/configuration\.nix|hosts/torre/configuration\.nix|flake\.nix|flake\.lock|\.github/workflows/nixos-check\.yml)$'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate shell, Fish and privacy helper syntax
        if: matrix.host == 'elytra'
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
            echo "Syntax OK: $script"
          done

          nix eval --raw ".#nixosConfigurations.elytra.config.home-manager.users.juan.programs.fish.interactiveShellInit" > /tmp/kigo-fish-init.fish
          nix build --no-link ".#nixosConfigurations.elytra.pkgs.fish"
          fish_path="$(nix eval --raw ".#nixosConfigurations.elytra.pkgs.fish.outPath")"
          "$fish_path/bin/fish" --no-execute /tmp/kigo-fish-init.fish
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for path in (
              Path("scripts/rustdesk-privacy-grabber.py"),
              Path("scripts/rustdesk-privacy-monitor.py"),
          ):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"Syntax OK: {path}")
          PY

      - name: Check flake outputs
        if: matrix.host == 'titan'
        run: |
          nix flake check --no-build --show-trace

      - name: Evaluate system closure
        run: |
          nix eval --show-trace --raw ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath" >/dev/null

      - name: Verify Elytra resource policy
        if: matrix.host == 'elytra'
        run: |
          test "$(nix eval --json '.#nixosConfigurations.elytra.config.nix.settings.max-jobs')" = "2"
          test "$(nix eval --json '.#nixosConfigurations.elytra.config.nix.settings.cores')" = "2"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.nix.daemonCPUSchedPolicy')" = "idle"
          test "$(nix eval --json '.#nixosConfigurations.elytra.config.zramSwap.enable')" = "true"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.zramSwap.algorithm')" = "zstd"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.services.scx-loader.config.default_mode')" = "Auto"
          test "$(nix eval --json '.#nixosConfigurations.elytra.config.services.power-profiles-daemon.enable')" = "true"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.home-manager.users.juan.qt.kde.settings.powerdevilrc.AC.Performance.PowerProfile')" = "performance"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.home-manager.users.juan.qt.kde.settings.powerdevilrc.Battery.Performance.PowerProfile')" = "power-saver"
          test "$(nix eval --raw '.#nixosConfigurations.elytra.config.home-manager.users.juan.qt.kde.settings.powerdevilrc.LowBattery.Performance.PowerProfile')" = "power-saver"

      - name: Build headless server closure
        if: matrix.host == 'atlas' || matrix.host == 'pico'
        run: |
          nix build --no-link --show-trace ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

      - name: Build the declarative Nori desktop package
        if: matrix.host == 'elytra' && steps.nori.outputs.required == 'true'
        run: |
          nix build --no-link --show-trace ".#packages.x86_64-linux.nori"

      - name: Build the declarative Nori CLI package
        if: matrix.host == 'elytra' && steps.nori.outputs.required == 'true'
        run: |
          nix build --no-link --show-trace ".#packages.x86_64-linux.nori-cli"
