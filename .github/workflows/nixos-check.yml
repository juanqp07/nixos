name: NixOS configuration evaluation

on:
  pull_request:
    paths:
      - "**.nix"
      - "flake.nix"
      - "flake.lock"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/nixos-check.yml"
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - "flake.nix"
      - "flake.lock"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/nixos-check.yml"

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - elytra
          - titan
          - atlas
          - pico
          - palco
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate shell and privacy helper syntax
        if: matrix.host == 'elytra'
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
            echo "Syntax OK: $script"
          done

          python3 - <<'PY'
          import ast
          from pathlib import Path

          for path in (
              Path("scripts/rustdesk-privacy-grabber.py"),
              Path("scripts/rustdesk-privacy-monitor.py"),
          ):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"Syntax OK: {path}")
          PY

      - name: Check flake outputs
        if: matrix.host == 'titan'
        run: |
          nix flake check --no-build --show-trace

      - name: Evaluate system closure
        run: |
          nix eval --show-trace --raw ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath" >/dev/null
