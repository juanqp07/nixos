name: NixOS configuration evaluation

on:
  pull_request:
    paths:
      - "**.nix"
      - "flake.nix"
      - "flake.lock"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/nixos-check.yml"
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - "flake.nix"
      - "flake.lock"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/nixos-check.yml"

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - elytra
          - titan
          - atlas
          - pico
          - palco
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect RustDesk package build changes
        id: rustdesk
        if: matrix.host == 'elytra'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$PUSH_BEFORE_SHA" "$GITHUB_SHA")"
          fi

          if grep -Eq '^(packages/rustdesk-unattended-wayland\.nix|flake\.nix|flake\.lock)$' <<< "$changed_files"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate shell, Fish and privacy helper syntax
        if: matrix.host == 'elytra'
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
            echo "Syntax OK: $script"
          done

          nix eval --raw ".#nixosConfigurations.elytra.config.home-manager.users.juan.programs.fish.interactiveShellInit" > /tmp/kigo-fish-init.fish
          nix build --no-link ".#nixosConfigurations.elytra.pkgs.fish"
          fish_path="$(nix eval --raw ".#nixosConfigurations.elytra.pkgs.fish.outPath")"
          "$fish_path/bin/fish" --no-execute /tmp/kigo-fish-init.fish
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for path in (
              Path("scripts/rustdesk-privacy-grabber.py"),
              Path("scripts/rustdesk-privacy-monitor.py"),
          ):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"Syntax OK: {path}")
          PY

      - name: Check flake outputs
        if: matrix.host == 'titan'
        run: |
          nix flake check --no-build --show-trace

      - name: Evaluate system closure
        run: |
          nix eval --show-trace --raw ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath" >/dev/null

      - name: Build the pinned RustDesk unattended Wayland package
        if: matrix.host == 'elytra' && steps.rustdesk.outputs.required == 'true'
        run: |
          nix build --no-link --show-trace ".#packages.x86_64-linux.rustdesk-unattended-wayland"
