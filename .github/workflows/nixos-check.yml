name: NixOS configuration evaluation

on:
  pull_request:
    paths:
      - "**.nix"
      - "flake.nix"
      - "flake.lock"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/nixos-check.yml"
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - "flake.nix"
      - "flake.lock"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/nixos-check.yml"

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - elytra
          - titan
          - atlas
          - pico
          - palco
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Nori package build changes
        id: nori
        if: matrix.host == 'elytra'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$PUSH_BEFORE_SHA" "$GITHUB_SHA")"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(packages/nori\.nix|packages/nori-cli\.nix|nixpkgs/pkgs/by-name/no/nori/package\.nix|nixpkgs/pkgs/by-name/no/nori-cli/package\.nix|hosts/portatil/configuration\.nix|hosts/torre/configuration\.nix|flake\.nix|flake\.lock|\.github/workflows/nixos-check\.yml)$'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate shell, Fish and privacy helper syntax
        if: matrix.host == 'elytra'
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
            echo "Syntax OK: $script"
          done

          nix eval --raw ".#nixosConfigurations.elytra.config.home-manager.users.juan.programs.fish.interactiveShellInit" > /tmp/kigo-fish-init.fish
          nix build --no-link ".#nixosConfigurations.elytra.pkgs.fish"
          fish_path="$(nix eval --raw ".#nixosConfigurations.elytra.pkgs.fish.outPath")"
          "$fish_path/bin/fish" --no-execute /tmp/kigo-fish-init.fish
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for path in (
              Path("scripts/rustdesk-privacy-grabber.py"),
              Path("scripts/rustdesk-privacy-monitor.py"),
          ):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"Syntax OK: {path}")
          PY

      - name: Check flake outputs
        if: matrix.host == 'titan'
        run: |
          nix flake check --no-build --show-trace

      - name: Evaluate system closure
        run: |
          nix eval --show-trace --raw ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath" >/dev/null

      - name: Validate Titan pre-login Sunshine KMS configuration
        if: matrix.host == 'titan'
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          prefix = ".#nixosConfigurations.titan.config."

          def nix_eval(path):
              command = ["nix", "eval", "--json", prefix + path]
              return json.loads(subprocess.check_output(command, text=True).strip())

          scalar_checks = {
              "services.sunshine.enable": True,
              "services.sunshine.autoStart": True,
              "services.sunshine.capSysAdmin": True,
              "services.sunshine.openFirewall": False,
              "services.sunshine.settings.capture": "kms",
              "services.sunshine.settings.upnp": "disabled",
              "services.sunshine.settings.origin_web_ui_allowed": "wan",
              "services.displayManager.sddm.wayland.enable": True,
              "users.users.juan.linger": True,
              "systemd.user.services.sunshine.unitConfig.ConditionUser": "juan",
              "security.wrappers.sunshine.owner": "root",
              "security.wrappers.sunshine.group": "sunshine-kms",
              "security.wrappers.sunshine.permissions": "u+rx,g+x,o-rwx",
              "security.wrappers.sunshine.capabilities": "cap_sys_admin+p",
          }

          for path, expected in scalar_checks.items():
              actual = nix_eval(path)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected!r}, got {actual!r}")
              print(f"OK {path} = {actual}")

          list_checks = {
              "systemd.user.services.sunshine.wantedBy": ["default.target"],
              "systemd.user.services.sunshine.partOf": [],
              "systemd.user.services.sunshine.wants": [],
              "systemd.user.services.sunshine.after": [],
              "networking.firewall.interfaces.wt0.allowedTCPPorts": [47984, 47989, 47990, 48010],
              "networking.firewall.interfaces.wt0.allowedUDPPorts": [47998, 47999, 48000, 48002, 48010],
          }

          for path, expected in list_checks.items():
              actual = nix_eval(path)
              missing = set(expected) - set(actual)
              if missing:
                  raise SystemExit(f"{path}: missing required ports {sorted(missing)!r}; got {actual!r}")
              print(f"OK {path} contains required ports {expected}")

          group_users = json.loads(subprocess.check_output([
              "nix", "eval", "--json", "--apply",
              'users: builtins.filter (name: builtins.elem "sunshine-kms" (users.${name}.extraGroups or [])) (builtins.attrNames users)',
              ".#nixosConfigurations.titan.config.users.users",
          ], text=True).strip())
          if group_users != ["juan"]:
              raise SystemExit(f"Only Juan may belong to sunshine-kms; found {group_users!r}")
          print("OK Juan is the only user in sunshine-kms")

          global_tcp = set(nix_eval("networking.firewall.allowedTCPPorts"))
          global_udp = set(nix_eval("networking.firewall.allowedUDPPorts"))
          sunshine_tcp = {47984, 47989, 47990, 48010}
          sunshine_udp = {47998, 47999, 48000, 48002, 48010}
          if global_tcp & sunshine_tcp or global_udp & sunshine_udp:
              raise SystemExit("Sunshine ports must not be opened on the global firewall")
          print("OK Sunshine ports are not opened globally")
          PY

      - name: Verify Sunshine KMS remains disabled on Elytra
        if: matrix.host == 'elytra'
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          checks = {
              "services.sunshine.enable": False,
              "services.displayManager.sddm.wayland.enable": False,
          }
          prefix = ".#nixosConfigurations.elytra.config."
          for path, expected in checks.items():
              actual = json.loads(subprocess.check_output(
                  ["nix", "eval", "--json", prefix + path], text=True
              ).strip())
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected!r}, got {actual!r}")
              print(f"OK {path} = {actual}")
          PY

      - name: Build the declarative Nori desktop package
        if: matrix.host == 'elytra' && steps.nori.outputs.required == 'true'
        run: |
          nix build --no-link --show-trace ".#packages.x86_64-linux.nori"

      - name: Build the declarative Nori CLI package
        if: matrix.host == 'elytra' && steps.nori.outputs.required == 'true'
        run: |
          nix build --no-link --show-trace ".#packages.x86_64-linux.nori-cli"
