name: Update Nori packages

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

# This workflow is the only one that needs write access. The token is not
# persisted in the checkout and is used only in the explicit publish steps.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-nori-packages
  cancel-in-progress: false

jobs:
  update:
    name: Check and update Nori releases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare update branch
        id: branch
        run: |
          set -Eeuo pipefail
          branch="automation/nori-updates"
          remote_sha=""
          git fetch origin main

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            remote_sha="$(git rev-parse FETCH_HEAD)"
            git switch --force-create "$branch" "$remote_sha"
            git rebase origin/main
          else
            git switch --create "$branch" origin/main
          fi

          {
            echo "branch=$branch"
            echo "remote_sha=$remote_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check the latest stable Nori release
        id: update
        run: python3 scripts/update-nori.py

      # Stage only package expressions. This also detects an earlier successful
      # push whose PR creation failed, so the next scheduled run can recover.
      - name: Detect pending package changes
        id: changes
        run: |
          set -Eeuo pipefail
          files=(
            nixpkgs/pkgs/by-name/no/nori/package.nix
            nixpkgs/pkgs/by-name/no/nori-cli/package.nix
          )
          git add -- "${files[@]}"

          if git diff --cached --quiet -- "${files[@]}"; then
            working_changes=false
          else
            working_changes=true
          fi

          if [[ "$working_changes" == true ]] || ! git diff --quiet origin/main...HEAD -- "${files[@]}"; then
            has_changes=true
          else
            has_changes=false
          fi

          {
            echo "working_changes=$working_changes"
            echo "has_changes=$has_changes"
          } >> "$GITHUB_OUTPUT"

      - name: Install Nix
        if: steps.changes.outputs.has_changes == 'true'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build both updated packages
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          nix build --no-link --show-trace \
            .#packages.x86_64-linux.nori \
            .#packages.x86_64-linux.nori-cli

      - name: Commit and push package changes
        if: steps.changes.outputs.working_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          REMOTE_SHA: ${{ steps.branch.outputs.remote_sha }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -Eeuo pipefail
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(nori): update packages to v$VERSION"

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          if [[ -n "$REMOTE_SHA" ]]; then
            git -c http.extraheader="AUTHORIZATION: basic $auth" push \
              --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" \
              origin "HEAD:refs/heads/$BRANCH"
          else
            git -c http.extraheader="AUTHORIZATION: basic $auth" push \
              origin "HEAD:refs/heads/$BRANCH"
          fi

      # Retry PR creation even when the release script reports changed=false.
      - name: Create or update pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -Eeuo pipefail
          title="chore(nori): update packages to v$VERSION"
          body="This PR was generated automatically from the latest stable [Nori release](https://github.com/norifm/nori/releases/tag/v$VERSION).

          It updates the desktop AppImage and CLI package versions and their SHA-256 hashes for both x86_64 and aarch64. The workflow builds both Nix packages before creating or updating this PR."

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$GITHUB_REPOSITORY_OWNER:$BRANCH" --json number --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body "$body"
            echo "Updated existing Nori PR #$existing_pr"
          elif ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$title" --body "$body"; then
            echo "::error::GitHub rejected automatic PR creation."
            echo "::error::Enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests."
            exit 1
          fi
