name: Update Flake inputs and container digests

on:
  schedule:
    - cron: "17 8 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-flake-and-container-digests
  cancel-in-progress: false

jobs:
  update:
    name: Refresh locked inputs and OCI digests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Prepare dependency update branch
        id: branch
        run: |
          set -Eeuo pipefail
          branch="automation/flake-and-image-updates"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk 'NR == 1 { print $1 }')"

          git fetch origin main
          git switch --create "$branch" origin/main

          {
            echo "branch=$branch"
            echo "remote_sha=$remote_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Update all locked Flake inputs
        run: nix flake update

      - name: Resolve current OCI image digests
        run: python3 scripts/update-docker-digests.py

      - name: Detect dependency changes
        id: changes
        run: |
          set -Eeuo pipefail
          files=(
            flake.lock
            hosts/servidor/configuration.nix
            hosts/zimablade/configuration.nix
          )
          git add -- "${files[@]}"
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Flake inputs and container image digests are already current."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push dependency updates
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          REMOTE_SHA: ${{ steps.branch.outputs.remote_sha }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): update Flake inputs and container digests"

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          if [[ -n "$REMOTE_SHA" ]]; then
            git -c http.extraheader="AUTHORIZATION: basic $auth" push \
              --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" \
              origin "HEAD:refs/heads/$BRANCH"
          else
            git -c http.extraheader="AUTHORIZATION: basic $auth" push \
              origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Create or update dependency pull request
        if: steps.changes.outputs.has_changes == 'true'
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -Eeuo pipefail
          title="chore(deps): update Flake inputs and container digests"
          body="This PR refreshes the revisions pinned in flake.lock and resolves the current immutable OCI manifest digests for the container images declared in the NixOS host modules.

          No deployment is performed. The PR must pass the quality gate and all five NixOS host evaluations before it is merged."

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$GITHUB_REPOSITORY_OWNER:$BRANCH" --json number --jq '.[0].number // empty')"

          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body "$body"
            echo "number=$existing_pr" >> "$GITHUB_OUTPUT"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "$title" --body "$body"
          fi

      # GITHUB_TOKEN-created pushes/PRs do not start other workflows automatically.
      # Dispatch the required CI explicitly against the exact update-branch commit.
      - name: Run the full NixOS validation workflow
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          gh workflow run nixos-check.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
